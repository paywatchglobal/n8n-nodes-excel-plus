# Publishes this n8n community node package to npm on every version tag push,
# using npm's Trusted Publishing (OIDC) so no long-lived NPM_TOKEN is needed.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. Trusted Publishing satisfies
# both requirements: it authenticates the publish via GitHub's OIDC token and
# attaches a provenance attestation that anyone can verify against this repo
# and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# - npm CLI 11.5.1 or later is required for Trusted Publishing. The workflow
#   upgrades npm in-place below so this is handled automatically.
# - @n8n/node-cli >= 0.23.0 (passes --provenance through to npm publish).
#
# ─── ONE-TIME SETUP ON npmjs.com ───────────────────────────────────────────────
#
# 1. Log in to npmjs.com and open the package settings for
#    @paywatchglobal/n8n-nodes-excel-plus (first publish must be done manually
#    or via a token; subsequent publishes can use Trusted Publishing).
# 2. Settings -> "Publishing access" -> "Trusted Publishers" -> "Add Publisher".
# 3. Pick GitHub Actions and fill in:
#       Repository owner: paywatchglobal
#       Repository name:  n8n-nodes-excel-plus
#       Workflow name:    publish.yml
#       Environment:      (leave blank)
# 4. Do NOT create an NPM_TOKEN secret. Trusted Publishing replaces it.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0, 1.0.0-rc.1).
# Switch to ['v*.*.*'] below if you prefer a leading "v" on tags.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Locally:
#
#   npm run release
#
# release-it (invoked by `n8n-node release`) handles versioning, changelog,
# commit, and tag push; the tag push then triggers this workflow.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint the OIDC token that npm exchanges for a publish credential.
      id-token: write
      # Read-only access is enough; release-it already produced the tag locally.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm to a Trusted-Publishing-capable version
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Release
        # `npm run release` -> `n8n-node release` -> release-it -> `npm publish --provenance`.
        # No NPM_TOKEN is set: npm CLI detects `id-token: write` permission and
        # exchanges the workflow's OIDC token for a short-lived publish credential
        # via the Trusted Publisher configured on npmjs.com.
        run: npm run release
