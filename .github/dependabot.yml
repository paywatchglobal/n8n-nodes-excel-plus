version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Keep exceljs out of the grouped PR so the version-bump workflow can act
      # on it cleanly without dragging unrelated changes into the release commit.
      dev-deps:
        dependency-type: development
        exclude-patterns:
          - exceljs
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
